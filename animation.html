<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Animation — Tony Xin</title>
	<meta name="description" content="A hand-coded ASCII donut rotating in real time, over a drifting starfield.">
	<link rel="canonical" href="https://tonyxin.com/animation.html">
	<meta name="robots" content="index, follow">

	<link rel="icon" href="favicon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="logo.svg">
	<meta name="theme-color" content="#0a0a0a">

	<link rel="preconnect" href="https://rsms.me/">
	<link rel="stylesheet" href="https://rsms.me/inter/inter.css">

	<style>
		:root {
			--ink: #0a0a0a;
			--muted: #6b6b6b;
			--faint: #b8b8b8;
			--line: rgba(0, 0, 0, 0.08);
			--bg: #fafaf8;
			--glow: rgba(120, 119, 198, 0.18);
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--ink: #f5f5f5;
				--muted: #9a9a9a;
				--faint: #555;
				--line: rgba(255, 255, 255, 0.08);
				--bg: #050505;
				--glow: rgba(120, 119, 198, 0.28);
			}
		}

		* { box-sizing: border-box; }
		html, body { margin: 0; padding: 0; height: 100%; }
		html { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
		body {
			background: var(--bg);
			color: var(--ink);
			-webkit-font-smoothing: antialiased;
			display: flex;
			flex-direction: column;
			min-height: 100vh;
			overflow: hidden;
			position: relative;
		}

		body::before {
			content: "";
			position: fixed;
			inset: 0;
			background:
				radial-gradient(ellipse 70% 60% at 50% 50%, var(--glow), transparent 70%);
			pointer-events: none;
			z-index: 0;
		}

		header, footer {
			max-width: 720px;
			margin: 0 auto;
			width: 100%;
			padding: 24px 28px;
			font-size: 13px;
			color: var(--muted);
			letter-spacing: 0.02em;
			position: relative;
			z-index: 3;
		}
		header a, footer a {
			color: var(--muted);
			text-decoration: none;
			transition: color .2s ease;
		}
		header a:hover, footer a:hover { color: var(--ink); }
		footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; }

		.stage {
			flex: 1;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 16px;
			position: relative;
			z-index: 2;
		}

		#stars {
			position: fixed;
			inset: 0;
			z-index: 1;
			pointer-events: none;
		}

		#donut {
			margin: 0;
			padding: 0;
			font-family: 'SF Mono', 'Menlo', 'Monaco', 'Consolas', monospace;
			font-size: clamp(9px, 1.3vmin, 13px);
			line-height: 1;
			letter-spacing: 0;
			color: var(--ink);
			white-space: pre;
			user-select: none;
			text-align: center;
			text-shadow: 0 0 12px var(--glow);
			transition: filter .3s ease;
		}
		#donut.boosted { filter: drop-shadow(0 0 18px rgba(120, 119, 198, 0.35)); }

		.caption {
			margin-top: 24px;
			color: var(--muted);
			font-size: 13px;
			letter-spacing: 0.02em;
			display: flex;
			align-items: center;
			gap: 10px;
			flex-wrap: wrap;
			justify-content: center;
		}
		.caption .kbd {
			font-family: 'SF Mono', 'Menlo', monospace;
			font-size: 11px;
			color: var(--ink);
			padding: 2px 6px;
			border: 1px solid var(--line);
			border-radius: 4px;
			background: rgba(128, 128, 128, 0.06);
		}

		.fade-in {
			opacity: 0;
			animation: fade .9s ease .1s forwards;
		}
		@keyframes fade { to { opacity: 1; } }

		@media (prefers-reduced-motion: reduce) {
			.fade-in { animation: none; opacity: 1; }
		}
	</style>
</head>
<body>

	<canvas id="stars"></canvas>

	<header class="fade-in">
		<a href="/">← Tony Xin</a>
	</header>

	<div class="stage">
		<pre id="donut" class="fade-in" aria-label="Rotating ASCII torus"></pre>
		<p class="caption fade-in">
			<span>rotate with mouse</span>
			<span>·</span>
			<span>hold <span class="kbd">space</span> to boost</span>
		</p>
	</div>

	<footer class="fade-in">
		<span>hand-coded · ~200 LOC of JS · no libraries</span>
		<span>donut.c</span>
	</footer>

	<script>
	(function () {
		// ----------------------------------------------------
		// starfield
		// ----------------------------------------------------
		const starCanvas = document.getElementById('stars');
		const sctx = starCanvas.getContext('2d');
		let stars = [];
		let sw = 0, sh = 0;

		function resizeStars() {
			const dpr = Math.min(window.devicePixelRatio || 1, 2);
			sw = starCanvas.width = window.innerWidth * dpr;
			sh = starCanvas.height = window.innerHeight * dpr;
			starCanvas.style.width = window.innerWidth + 'px';
			starCanvas.style.height = window.innerHeight + 'px';
			sctx.scale(dpr, dpr);

			const count = Math.floor((window.innerWidth * window.innerHeight) / 9000);
			stars = [];
			for (let i = 0; i < count; i++) {
				stars.push({
					x: Math.random() * window.innerWidth,
					y: Math.random() * window.innerHeight,
					z: Math.random() * 0.9 + 0.1,    // depth
					vx: (Math.random() - 0.5) * 0.05,
					vy: (Math.random() - 0.5) * 0.05,
					tw: Math.random() * Math.PI * 2, // twinkle phase
				});
			}
		}
		resizeStars();
		window.addEventListener('resize', resizeStars);

		function drawStars(t) {
			sctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
			const dark = matchMedia('(prefers-color-scheme: dark)').matches;
			const baseColor = dark ? '245, 245, 245' : '10, 10, 10';
			for (const s of stars) {
				s.x += s.vx * s.z;
				s.y += s.vy * s.z;
				if (s.x < 0) s.x += window.innerWidth;
				if (s.x > window.innerWidth) s.x -= window.innerWidth;
				if (s.y < 0) s.y += window.innerHeight;
				if (s.y > window.innerHeight) s.y -= window.innerHeight;

				const twinkle = 0.5 + 0.5 * Math.sin(t * 0.002 + s.tw);
				const a = 0.15 * s.z + 0.25 * s.z * twinkle;
				sctx.fillStyle = `rgba(${baseColor}, ${a})`;
				const r = s.z * 1.1;
				sctx.fillRect(s.x, s.y, r, r);
			}
		}

		// ----------------------------------------------------
		// ASCII donut (donut.c style — torus in 3D, rendered
		// with luminance-mapped characters via z-buffer)
		// ----------------------------------------------------
		const out = document.getElementById('donut');
		const ramp = '.,-~:;=!*#$@';
		// canvas size in character cells
		let W = 60, H = 30;
		// rotation state
		let A = 0, B = 0;
		// mouse influence
		let mx = 0.5, my = 0.5;
		let targetMX = 0.5, targetMY = 0.5;
		// boost (space bar)
		let boost = 1;
		let targetBoost = 1;

		function fitSize() {
			// measure one monospace character in the current style
			const probe = document.createElement('span');
			probe.style.cssText = 'position:absolute;visibility:hidden;white-space:pre;font-family:inherit;font-size:inherit;line-height:1;';
			probe.textContent = 'M'.repeat(40);
			out.appendChild(probe);
			const cw = probe.getBoundingClientRect().width / 40;
			out.removeChild(probe);
			const ch = parseFloat(getComputedStyle(out).fontSize);

			// aim for a square-ish field that fits comfortably
			const maxW = Math.min(window.innerWidth * 0.86, 720);
			const maxH = Math.min(window.innerHeight * 0.6, 520);
			W = Math.max(40, Math.floor(maxW / cw));
			H = Math.max(22, Math.floor(maxH / ch));
			if (W % 2 === 0) W += 1;
			if (H % 2 === 0) H += 1;
		}
		fitSize();
		window.addEventListener('resize', fitSize);

		window.addEventListener('mousemove', (e) => {
			targetMX = e.clientX / window.innerWidth;
			targetMY = e.clientY / window.innerHeight;
		});

		window.addEventListener('keydown', (e) => {
			if (e.code === 'Space') { targetBoost = 3.2; e.preventDefault(); }
		});
		window.addEventListener('keyup', (e) => {
			if (e.code === 'Space') targetBoost = 1;
		});
		// tap-to-boost on touch
		window.addEventListener('pointerdown', () => { targetBoost = 3.2; });
		window.addEventListener('pointerup', () => { targetBoost = 1; });

		function renderDonut() {
			// lerp mouse & boost
			mx += (targetMX - mx) * 0.06;
			my += (targetMY - my) * 0.06;
			boost += (targetBoost - boost) * 0.08;

			if (boost > 1.4) out.classList.add('boosted');
			else out.classList.remove('boosted');

			// base rotation speeds, modulated by mouse
			const axA = 0.03 + (my - 0.5) * 0.08;
			const axB = 0.02 + (mx - 0.5) * 0.08;
			A += axA * boost;
			B += axB * boost;

			// donut.c parameters
			const R1 = 1;               // tube radius
			const R2 = 2;               // donut radius
			const K2 = 5;               // distance from viewer
			// K1 scales the projection; tuned to fit our grid
			const K1 = W * K2 * 3 / (8 * (R1 + R2));

			const chars = new Array(W * H).fill(' ');
			const zbuf = new Array(W * H).fill(0);

			const cosA = Math.cos(A), sinA = Math.sin(A);
			const cosB = Math.cos(B), sinB = Math.sin(B);

			// step sizes — smaller = denser = slower
			const thetaStep = 0.14;
			const phiStep = 0.04;

			for (let theta = 0; theta < 6.28; theta += thetaStep) {
				const cosT = Math.cos(theta), sinT = Math.sin(theta);
				for (let phi = 0; phi < 6.28; phi += phiStep) {
					const cosP = Math.cos(phi), sinP = Math.sin(phi);

					const cx = R2 + R1 * cosT;   // circle x
					const cy = R1 * sinT;         // circle y

					// 3D coords after rotation
					const x = cx * (cosB * cosP + sinA * sinB * sinP) - cy * cosA * sinB;
					const y = cx * (sinB * cosP - sinA * cosB * sinP) + cy * cosA * cosB;
					const z = K2 + cosA * cx * sinP + cy * sinA;
					const ooz = 1 / z;

					// project to grid (y aspect corrected — chars are ~2x tall)
					const xp = (W / 2 + K1 * ooz * x) | 0;
					const yp = (H / 2 - K1 * ooz * y * 0.5) | 0;

					if (xp < 0 || xp >= W || yp < 0 || yp >= H) continue;

					// luminance via surface normal · light dir (0.707, 0.707, -0.707)
					const L = cosP * cosT * sinB
							- cosA * cosT * sinP
							- sinA * sinT
							+ cosB * (cosA * sinT - cosT * sinA * sinP);

					const idx = xp + yp * W;
					if (L > 0 && ooz > zbuf[idx]) {
						zbuf[idx] = ooz;
						const li = Math.min(ramp.length - 1, Math.max(0, (L * 8) | 0));
						chars[idx] = ramp[li];
					}
				}
			}

			// build string
			let s = '';
			for (let y = 0; y < H; y++) {
				s += chars.slice(y * W, (y + 1) * W).join('') + (y < H - 1 ? '\n' : '');
			}
			out.textContent = s;
		}

		function loop(t) {
			drawStars(t);
			renderDonut();
			requestAnimationFrame(loop);
		}
		requestAnimationFrame(loop);
	})();
	</script>

</body>
</html>
