<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Animation — Tony Xin</title>
	<meta name="description" content="A hand-built SVG animation — an isometric cube assembling itself, line by line.">
	<link rel="canonical" href="https://tonyxin.com/animation.html">
	<meta name="robots" content="index, follow">

	<link rel="preconnect" href="https://rsms.me/">
	<link rel="stylesheet" href="https://rsms.me/inter/inter.css">

	<style>
		:root {
			--ink: #111;
			--muted: #6b6b6b;
			--line: #e6e6e6;
			--bg: #fafaf9;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--ink: #f2f2f2;
				--muted: #9a9a9a;
				--line: #222;
				--bg: #0e0e0e;
			}
		}

		* { box-sizing: border-box; }
		html, body { margin: 0; padding: 0; height: 100%; }
		html { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
		body {
			background: var(--bg);
			color: var(--ink);
			-webkit-font-smoothing: antialiased;
			display: flex;
			flex-direction: column;
			min-height: 100vh;
		}

		header, footer {
			max-width: 720px;
			margin: 0 auto;
			width: 100%;
			padding: 28px;
			font-size: 14px;
			color: var(--muted);
		}
		header a, footer a {
			color: var(--muted);
			text-decoration: none;
		}
		header a:hover, footer a:hover { color: var(--ink); }

		.stage {
			flex: 1;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 24px;
		}

		.stage svg {
			width: min(80vmin, 520px);
			height: auto;
			display: block;
		}

		.caption {
			margin-top: 28px;
			color: var(--muted);
			font-size: 14px;
			letter-spacing: 0.01em;
		}

		/* ---- cube build animation ----

		   Each of the nine visible edges of an isometric cube
		   draws itself with the classic stroke-dasharray trick,
		   then the three front-facing faces fill in at a low
		   opacity, then the whole rig breathes & rotates forever.
		*/

		#cube {
			--stroke: var(--ink);
			--face: var(--ink);
			transform-origin: 50% 50%;
			animation: float 9s ease-in-out infinite;
		}

		#cube .edge {
			stroke: var(--stroke);
			stroke-width: 1.4;
			stroke-linecap: round;
			stroke-linejoin: round;
			fill: none;
			stroke-dasharray: 260;
			stroke-dashoffset: 260;
			animation: draw 1.1s cubic-bezier(.7,.1,.2,1) forwards;
		}

		#cube .face {
			fill: var(--face);
			opacity: 0;
			animation: faceIn 1.1s ease forwards;
		}

		/* staggered drawing of edges */
		#cube .e1 { animation-delay: .10s; }
		#cube .e2 { animation-delay: .22s; }
		#cube .e3 { animation-delay: .34s; }
		#cube .e4 { animation-delay: .46s; }
		#cube .e5 { animation-delay: .58s; }
		#cube .e6 { animation-delay: .70s; }
		#cube .e7 { animation-delay: .82s; }
		#cube .e8 { animation-delay: .94s; }
		#cube .e9 { animation-delay: 1.06s; }

		#cube .f-top   { animation-delay: 1.25s; }
		#cube .f-left  { animation-delay: 1.35s; }
		#cube .f-right { animation-delay: 1.45s; }

		@keyframes draw {
			to { stroke-dashoffset: 0; }
		}

		@keyframes faceIn {
			0%   { opacity: 0; }
			100% { opacity: var(--face-opacity, 0.06); }
		}
		#cube .f-top   { --face-opacity: 0.10; }
		#cube .f-left  { --face-opacity: 0.04; }
		#cube .f-right { --face-opacity: 0.07; }

		/* whole-rig gentle idle */
		@keyframes float {
			0%, 100% { transform: translateY(0) rotate(0deg); }
			50%      { transform: translateY(-6px) rotate(-1.2deg); }
		}

		/* orbital dot */
		.orbit {
			transform-origin: 140px 140px;
			animation: spin 14s linear infinite;
		}
		.orbit circle {
			fill: var(--ink);
			opacity: .55;
		}
		@keyframes spin {
			to { transform: rotate(360deg); }
		}

		@media (prefers-reduced-motion: reduce) {
			#cube, #cube .edge, #cube .face, .orbit {
				animation: none !important;
			}
			#cube .edge { stroke-dashoffset: 0; }
			#cube .face { opacity: .06; }
		}
	</style>
</head>
<body>

	<header>
		<a href="/">← Tony Xin</a>
	</header>

	<div class="stage">
		<!--
			Isometric cube on a 280x260 viewBox.
			Vertices (isometric projection):
			  top-top     = (140,  40)
			  top-left    = ( 50,  90)
			  top-right   = (230,  90)
			  top-front   = (140, 140)   [center, front-top vertex]
			  bot-left    = ( 50, 190)
			  bot-right   = (230, 190)
			  bot-front   = (140, 240)
		-->
		<svg id="cube"
			 viewBox="0 0 280 260"
			 role="img"
			 aria-labelledby="cubeTitle cubeDesc"
			 xmlns="http://www.w3.org/2000/svg">

			<title id="cubeTitle">An isometric cube assembling itself</title>
			<desc id="cubeDesc">A minimal black line drawing of a cube. Its nine edges draw themselves one after another, its three faces fade in softly, and the whole figure breathes.</desc>

			<!-- Faces (drawn underneath so strokes sit on top) -->
			<polygon class="face f-top"
				points="140,40 230,90 140,140 50,90" />
			<polygon class="face f-left"
				points="50,90 140,140 140,240 50,190" />
			<polygon class="face f-right"
				points="230,90 230,190 140,240 140,140" />

			<!-- Top rhombus edges -->
			<line class="edge e1" x1="140" y1="40"  x2="230" y2="90" />
			<line class="edge e2" x1="230" y1="90"  x2="140" y2="140" />
			<line class="edge e3" x1="140" y1="140" x2="50"  y2="90" />
			<line class="edge e4" x1="50"  y1="90"  x2="140" y2="40" />

			<!-- Vertical edges (the three visible) -->
			<line class="edge e5" x1="50"  y1="90"  x2="50"  y2="190" />
			<line class="edge e6" x1="140" y1="140" x2="140" y2="240" />
			<line class="edge e7" x1="230" y1="90"  x2="230" y2="190" />

			<!-- Bottom front edges (the V at the bottom) -->
			<line class="edge e8" x1="50"  y1="190" x2="140" y2="240" />
			<line class="edge e9" x1="230" y1="190" x2="140" y2="240" />

			<!-- Orbital dot -->
			<g class="orbit">
				<circle cx="140" cy="30" r="2.6" />
			</g>
		</svg>

		<p class="caption">build, line by line.</p>
	</div>

	<footer>
		<span>Hand-coded SVG · no libraries</span>
	</footer>

</body>
</html>
